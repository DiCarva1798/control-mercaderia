<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Control de Mercadería</title>
<style>
  :root{
    --bg:#0f1319;
    --surface:#171e27;
    --surface-2:#1e2733;
    --surface-3:#252f3d;
    --border:#2a3543;
    --text:#e7ebf0;
    --text-dim:#8b96a5;
    --text-faint:#5b6577;
    --in:#34d399;
    --in-dim:#1a3d31;
    --out:#fb7185;
    --out-dim:#3d1e24;
    --warn:#fbbf24;
    --brand:#5b9dff;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    --radius: 8px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  #root{min-height:100vh;}
  ::selection{background:var(--brand);color:#fff;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}
  input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{
    outline:2px solid var(--brand);outline-offset:1px;
  }

  /* barcode signature pattern */
  .barcode-strip{
    height:14px;
    background-image: repeating-linear-gradient(90deg,
      #000 0px, #000 2px, transparent 2px, transparent 4px,
      #000 4px, #000 5px, transparent 5px, transparent 9px,
      #000 9px, #000 12px, transparent 12px, transparent 14px);
    background-color: var(--warn);
    opacity:.9;
  }
  .barcode-strip.thin{height:6px;}

  /* ---------- LOGIN ---------- */
  .login-wrap{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 15% 20%, rgba(91,157,255,.08), transparent 40%),
      radial-gradient(circle at 85% 80%, rgba(251,191,36,.06), transparent 40%),
      var(--bg);
    padding:24px;
  }
  .login-card{
    width:100%;max-width:380px;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
  }
  .login-header{padding:28px 28px 20px;}
  .login-eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.12em;
    color:var(--warn);text-transform:uppercase;margin:0 0 6px;
  }
  .login-title{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.01em;}
  .login-sub{color:var(--text-dim);font-size:13px;margin:0;}
  .login-body{padding:4px 28px 28px;display:flex;flex-direction:column;gap:14px;}
  .field label{
    display:block;font-size:12px;color:var(--text-dim);margin-bottom:6px;
    font-weight:600;letter-spacing:.01em;
  }
  .field input, .field select, .field textarea{
    width:100%;background:var(--surface-2);border:1px solid var(--border);
    color:var(--text);border-radius:6px;padding:10px 12px;font-size:14px;
  }
  .field input[type="checkbox"]{
    width:16px;height:16px;flex:0 0 16px;padding:0;background:var(--surface-2);
    border:1px solid var(--border);border-radius:4px;accent-color:var(--brand);vertical-align:middle;
  }
  .field textarea{resize:vertical;min-height:60px;}
  .btn{
    border:none;border-radius:6px;padding:10px 16px;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:6px;transition:transform .08s, filter .12s;
  }
  .btn:active{transform:scale(.97);}
  .btn:hover{filter:brightness(1.12);}
  .btn-primary{background:var(--brand);color:#08131f;}
  .btn-in{background:var(--in);color:#062017;}
  .btn-out{background:var(--out);color:#2a0810;}
  .btn-warn{background:var(--warn);color:#231a02;}
  .btn-ghost{background:var(--surface-2);color:var(--text);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--surface-3);}
  .btn-danger{background:transparent;color:var(--out);border:1px solid var(--out-dim);}
  .btn:disabled{opacity:.4;cursor:not-allowed;filter:none;}
  .login-error{
    background:var(--out-dim);color:#ffb4bf;border:1px solid #5c2530;
    border-radius:6px;padding:8px 12px;font-size:12.5px;
  }
  .login-hint{
    margin-top:2px;font-size:11.5px;color:var(--text-faint);line-height:1.5;
  }

  /* ---------- SHELL ---------- */
  .shell{display:flex;min-height:100vh;}
  .sidebar{
    width:216px;flex-shrink:0;background:var(--surface);
    border-right:1px solid var(--border);
    display:flex;flex-direction:column;
  }
  .brand-block{padding:18px 18px 14px;}
  .brand-name{font-weight:800;font-size:15px;letter-spacing:-.01em;}
  .brand-name span{color:var(--warn);}
  .brand-sub{font-family:var(--mono);font-size:10px;color:var(--text-faint);margin-top:2px;letter-spacing:.06em;}
  .nav{padding:8px 10px;display:flex;flex-direction:column;gap:2px;flex:1;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:6px;
    color:var(--text-dim);font-size:13px;font-weight:600;background:transparent;border:none;
    text-align:left;width:100%;
  }
  .nav-item:hover{background:var(--surface-2);color:var(--text);}
  .nav-item.active{background:var(--surface-3);color:var(--text);box-shadow:inset 2px 0 0 var(--brand);}
  .nav-icon{width:16px;text-align:center;font-family:var(--mono);font-size:12px;color:var(--text-faint);}
  .nav-item.active .nav-icon{color:var(--brand);}
  .sidebar-foot{padding:12px 14px;border-top:1px solid var(--border);}
  .user-chip{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .user-avatar{
    width:28px;height:28px;border-radius:50%;background:var(--surface-3);
    display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;
    color:var(--warn);flex-shrink:0;
  }
  .user-name{font-size:12.5px;font-weight:700;line-height:1.2;}
  .user-role{font-size:10.5px;color:var(--text-faint);font-family:var(--mono);text-transform:uppercase;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    height:56px;border-bottom:1px solid var(--border);display:flex;align-items:center;
    justify-content:space-between;padding:0 24px;flex-shrink:0;background:var(--bg);
  }
  .topbar-title{font-size:15px;font-weight:700;}
  .topbar-sub{font-size:11.5px;color:var(--text-faint);font-family:var(--mono);}
  .content{padding:24px;flex:1;overflow-y:auto;}

  /* ---------- GENERIC UI ---------- */
  .grid-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:16px;}
  .card-label{font-size:11px;color:var(--text-faint);text-transform:uppercase;letter-spacing:.06em;font-weight:700;margin-bottom:8px;}
  .card-value{font-family:var(--mono);font-size:26px;font-weight:700;}
  .card-value.in{color:var(--in);}
  .card-value.out{color:var(--out);}

  .panel{background:var(--surface);border:1px solid var(--border);border-radius:10px;margin-bottom:20px;overflow:hidden;}
  .panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .panel-title{font-size:13.5px;font-weight:700;}
  .panel-body{padding:18px;}

  table{width:100%;border-collapse:collapse;}
  th{
    text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--text-faint);font-weight:700;padding:10px 14px;border-bottom:1px solid var(--border);
    background:var(--surface-2);
  }
  td{padding:10px 14px;border-bottom:1px solid var(--border);font-size:13px;vertical-align:middle;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:rgba(255,255,255,.015);}
  .mono{font-family:var(--mono);}
  .tag{
    display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:20px;
    font-size:11px;font-weight:700;font-family:var(--mono);
  }
  .tag.in, .tag.ingreso{background:var(--in-dim);color:var(--in);}
  .tag.out, .tag.salida{background:var(--out-dim);color:var(--out);}
  .tag.traslado{background:#2a2410;color:var(--warn);}
  .tag.scanner{background:#1e2c3d;color:var(--brand);}
  .tag.manual{background:var(--surface-3);color:var(--text-dim);}
  .tag.edited{background:#3a2f0c;color:var(--warn);}
  .tag.admin{background:#3a1e0c;color:var(--warn);}
  .tag.operador{background:#0c2b3a;color:var(--brand);}
  .empty-state{padding:40px 20px;text-align:center;color:var(--text-faint);font-size:13px;}
  .empty-state .big{font-size:28px;margin-bottom:8px;}

  .toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;}
  .toolbar .field{min-width:150px;}
  .toolbar .field label{margin-bottom:4px;}

  .modal-overlay{
    position:fixed;inset:0;background:rgba(5,8,12,.7);display:flex;align-items:center;
    justify-content:center;z-index:50;padding:20px;
  }
  .modal{
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    width:100%;max-width:460px;max-height:90vh;overflow-y:auto;
  }
  .modal-head{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
  .modal-title{font-size:15px;font-weight:700;}
  .modal-close{background:none;border:none;color:var(--text-faint);font-size:18px;line-height:1;}
  .modal-body{padding:20px;display:flex;flex-direction:column;gap:14px;}
  .modal-foot{padding:14px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

  .scan-box{
    border:2px dashed var(--brand);border-radius:10px;padding:20px;background:rgba(91,157,255,.05);
    display:flex;flex-direction:column;gap:10px;
  }
  .scan-box.armed{border-color:var(--warn);background:rgba(251,191,36,.06);}
  .scan-input{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:6px;padding:14px;font-size:16px;font-family:var(--mono);letter-spacing:.05em;
  }
  .scan-hint{font-size:11.5px;color:var(--text-faint);display:flex;align-items:center;gap:6px;}
  .pulse-dot{width:7px;height:7px;border-radius:50%;background:var(--in);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%{opacity:1;}50%{opacity:.3;}100%{opacity:1;}}

  .divider-label{
    display:flex;align-items:center;gap:10px;margin:22px 0 14px;color:var(--text-faint);
    font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;
  }
  .divider-label::after{content:"";flex:1;height:1px;background:var(--border);}

  .history-list{display:flex;flex-direction:column;gap:8px;margin-top:6px;}
  .history-item{
    font-size:12px;color:var(--text-dim);background:var(--surface-2);border-radius:6px;
    padding:8px 10px;font-family:var(--mono);
  }
  .history-item b{color:var(--warn);}

  .row-flex{display:flex;gap:10px;}
  .row-flex > *{flex:1;}
  .link-btn{background:none;border:none;color:var(--brand);font-size:12.5px;font-weight:600;padding:0;}
  .link-btn:hover{text-decoration:underline;}

  .toast{
    position:fixed;bottom:20px;right:20px;background:var(--surface-3);border:1px solid var(--border);
    border-left:3px solid var(--in);padding:12px 16px;border-radius:8px;font-size:13px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);z-index:100;max-width:320px;
  }
  .toast.err{border-left-color:var(--out);}
  .badge-count{
    background:var(--surface-3);color:var(--text-dim);font-size:10px;font-family:var(--mono);
    padding:1px 6px;border-radius:10px;margin-left:auto;
  }
  .stock-low{color:var(--out);}
  .stock-ok{color:var(--in);}
  .tag.bodega-k{background:#132a3a;color:#7dd3fc;}
  .tag.bodega-r{background:#2a1e3a;color:#c4b5fd;}
  .tag.bodega-c{background:#1a2e1a;color:#86efac;}
  .serial-chip{
    display:inline-block;font-family:var(--mono);font-size:11px;background:var(--surface-3);
    color:var(--text-dim);padding:1px 7px;border-radius:4px;margin-right:4px;
  }
  .btn-xls{background:#1d6f42;color:#fff;}
  .cat-chip{
    display:inline-flex;align-items:center;gap:6px;background:var(--surface-2);border:1px solid var(--border);
    border-radius:20px;padding:5px 12px;font-size:12.5px;font-weight:600;text-transform:capitalize;
  }
  .cat-chip button{background:none;border:none;color:var(--text-faint);font-size:12px;padding:0;line-height:1;}
  .cat-chip button:hover{color:var(--out);}
  @media(max-width:840px){
    .sidebar{width:64px;}
    .brand-block{padding:14px 8px;}
    .brand-name, .brand-sub, .nav-item span.label, .user-name, .user-role{display:none;}
    .nav-item{justify-content:center;}
    .user-chip{justify-content:center;}
    .content{padding:14px;}
  }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* =========================================================
   CONTROL DE MERCADERÍA — lógica de aplicación
   Persistencia: Supabase (base de datos en la nube, compartida
   por todo el personal de bodega que use la aplicación).
   ========================================================= */

/* ---------------------------------------------------------
   CONFIGURACIÓN DE SUPABASE
   Pega aquí la URL y la clave "anon public" de tu proyecto de
   Supabase (Project Settings → API). Sin esto, la app no podrá
   guardar ni leer datos.
   --------------------------------------------------------- */
const SUPABASE_URL = 'https://dodccjdcgjeyxdeorogx.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_H3d-O_P7ozBwKt1l2U2j1Q_nBkj6Tos';

let supabaseClient = null;
function getSupabase(){
  if(supabaseClient) return supabaseClient;
  if(!SUPABASE_URL || SUPABASE_URL.indexOf('PEGA_AQUI') !== -1 ||
     !SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.indexOf('PEGA_AQUI') !== -1){
    return null;
  }
  if(typeof window.supabase === 'undefined') return null;
  supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  return supabaseClient;
}

const KEYS = {
  users: 'inv:users',
  catalogo: 'inv:catalogo',
  movimientos: 'inv:movimientos',
  categorias: 'inv:categorias',
};

const BODEGAS = ['Bodega Kennedy', 'Bodega Rotonda', 'Bodega Cuenca'];
function bodegaTagClass(b){
  if(b === 'Bodega Kennedy') return 'bodega-k';
  if(b === 'Bodega Rotonda') return 'bodega-r';
  return 'bodega-c';
}
const OPERADORES = ['Operador 1', 'Operador 2', 'Operador 3', 'Operador 4', 'Operador 5'];

/* Código de autorización por operador. No se guarda en texto plano en el
   código fuente; se compara por huella (hash) para que abrir el archivo
   no revele los códigos directamente. Esto es una barrera básica de
   trazabilidad interna, no un sistema de seguridad criptográfico. */
function hashCodigoOperador(str){
  let h = 0;
  for(let i=0;i<str.length;i++){ h = (Math.imul(31,h) + str.charCodeAt(i)) >>> 0; }
  return h.toString(36);
}
const OPERADOR_CODIGOS_HASH = {
  'Operador 1': 'xpnn',
  'Operador 2': '10s51',
  'Operador 3': 'yy7w',
  'Operador 4': 'yyw0',
  'Operador 5': 'z0hq',
};
function validarCodigoOperador(operador, codigo){
  if(!operador || !codigo) return false;
  const esperado = OPERADOR_CODIGOS_HASH[operador];
  if(!esperado) return false;
  return hashCodigoOperador(String(codigo).trim()) === esperado;
}

let state = {
  loaded: false,
  configError: false,
  users: [],
  catalogo: [],
  movimientos: [],
  currentUser: null,
  view: 'dashboard',
  loginError: '',
  toast: null,
  // ingreso/salida scan flow
  scanBuffer: { ingreso: '', salida: '' },
  pendingScan: { ingreso: null, salida: null }, // {itemId, varianteId, cantidad}
  workBodega: { ingreso: BODEGAS[0], salida: BODEGAS[0] },
  manualForm: {
    ingreso: { codigo: '', varianteId: '', cantidad: 1, fecha: todayStr(), notas: '', numerosSerie: '',
               proveedor: '', iva: 'no', modoValor: 'unitario', valor: '', operador: '' },
    salida:  { itemId: '', varianteId: '', cantidad: 1, fecha: todayStr(), notas: '', numerosSerie: '',
               modoValor: 'unitario', valor: '' },
  },
  // traslados
  traslado: { bodegaDestino: BODEGAS[1], scanBuffer: '', busqueda: '', cola: [], notas: '', operador: '',
              bulk: { itemId: '', varianteId: '', bodegaOrigen: BODEGAS[0], cantidad: 1, operador: '', notas: '' } },
  // salida (por búsqueda de serie, sin escaneo obligatorio)
  salida: { bodega: BODEGAS[0], busqueda: '', cola: [], notas: '', modoVenta: 'unitario', precioVenta: '',
            factura: '', operador: '',
            bulk: { itemId: '', varianteId: '', cantidad: 1, factura: '', operador: '', modoVenta: 'unitario', precioVenta: '' } },
  // filtros movimientos
  filtro: { itemId: '', tipo: '', desde: '', hasta: '', texto: '', bodega: '', serie: '' },
  editingMov: null,
  editForm: null,
  // catálogo UI
  categorias: [],
  newItem: { tipo: '', nombre: '', marca: '' },
  newCategoria: '',
  itemSeleccionado: '',
  newVariante: {}, // itemId -> {sku, descripcion}
  // usuarios UI
  newUser: { username: '', password: '', nombre: '', role: 'operador' },
};

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function nowStr(){
  return new Date().toLocaleString('es-ES', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
}
function uid(prefix){
  return prefix + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
}
function parseSeries(text){
  if(!text) return [];
  return text.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean);
}

/* ---------------- storage helpers (Supabase) ---------------- */
async function storageGet(key, fallback){
  const sb = getSupabase();
  if(!sb) return fallback;
  try{
    const { data, error } = await sb.from('app_storage').select('value').eq('key', key).maybeSingle();
    if(error){ console.error('[Supabase] Error al leer "'+key+'":', error); return fallback; }
    if(!data) return fallback;
    return data.value;
  }catch(e){
    console.error('[Supabase] Excepción al leer "'+key+'":', e);
    return fallback;
  }
}
async function storageSet(key, value){
  const sb = getSupabase();
  if(!sb){ showToast('No hay conexión con la base de datos. Revisa la configuración de Supabase.', true); return; }
  try{
    const { error } = await sb.from('app_storage').upsert({ key, value, updated_at: new Date().toISOString() });
    if(error){ console.error('[Supabase] Error al guardar "'+key+'":', error); showToast('No se pudo guardar en la base de datos: ' + error.message, true); }
  }catch(e){
    console.error('[Supabase] Excepción al guardar "'+key+'":', e);
    showToast('No se pudo guardar en la base de datos.', true);
  }
}

function defaultUsers(){
  return [
    { id: uid('u'), username: 'admin', password: 'admin123', nombre: 'Administrador', role: 'admin' },
    { id: uid('u'), username: 'operador', password: 'operador123', nombre: 'Operador de bodega', role: 'operador' },
  ];
}
function defaultCatalogo(){
  return [];
}

function defaultCategorias(){
  return ['consola', 'accesorio'];
}

async function loadAll(){
  if(!getSupabase()){
    state.configError = true;
    state.loaded = true;
    render();
    return;
  }
  state.users = await storageGet(KEYS.users, null);
  if(!state.users){ state.users = defaultUsers(); await storageSet(KEYS.users, state.users); }

  state.catalogo = await storageGet(KEYS.catalogo, null);
  if(!state.catalogo){ state.catalogo = defaultCatalogo(); await storageSet(KEYS.catalogo, state.catalogo); }

  state.categorias = await storageGet(KEYS.categorias, null);
  if(!state.categorias){ state.categorias = defaultCategorias(); await storageSet(KEYS.categorias, state.categorias); }
  state.newItem.tipo = state.categorias[0] || '';

  state.movimientos = await storageGet(KEYS.movimientos, []);
  state.loaded = true;
  render();
}

function showToast(msg, isErr){
  state.toast = { msg, isErr };
  render();
  setTimeout(()=>{ state.toast = null; render(); }, 3200);
}

/* ---------------- data helpers ---------------- */
function datalistOpcionesCodigos(){
  return allVariantes().map(v => `<option value="${v.sku}">${v.itemNombre} — ${v.descripcion}</option>`).join('');
}
function datalistOpcionesNombres(){
  const vs = allVariantes();
  const opts = new Set();
  vs.forEach(v => { opts.add(v.itemNombre); opts.add(v.sku); });
  return [...opts].map(o => `<option value="${o}"></option>`).join('');
}
function allVariantes(){
  const out = [];
  for(const item of state.catalogo){
    for(const v of item.variantes){
      out.push({ ...v, itemId: item.id, itemNombre: item.nombre, tipo: item.tipo, marca: item.marca });
    }
  }
  return out;
}
function findVarianteBySku(sku){
  return allVariantes().find(v => v.sku.toLowerCase() === sku.trim().toLowerCase());
}
function findVariante(varianteId){
  return allVariantes().find(v => v.id === varianteId);
}
function calcStock(varianteId, bodega){
  let stock = 0;
  for(const m of state.movimientos){
    if(m.varianteId !== varianteId) continue;
    if(m.tipo === 'ingreso'){
      if(!bodega || m.bodega === bodega) stock += m.cantidad;
    } else if(m.tipo === 'salida'){
      if(!bodega || m.bodega === bodega) stock -= m.cantidad;
    } else if(m.tipo === 'traslado'){
      if(bodega){
        if(m.bodegaDestino === bodega) stock += m.cantidad;
        if(m.bodegaOrigen === bodega) stock -= m.cantidad;
      }
      // sin filtro de bodega, un traslado no cambia el total general
    }
  }
  return stock;
}
function calcStockPorBodega(varianteId){
  const out = {};
  for(const b of BODEGAS) out[b] = calcStock(varianteId, b);
  out.total = calcStock(varianteId);
  return out;
}
function movimientosDeVariante(varianteId){
  return state.movimientos.filter(m => m.varianteId === varianteId);
}
function buscarPorSerie(serie){
  const q = serie.trim().toLowerCase();
  if(!q) return [];
  return state.movimientos.filter(m => (m.numerosSerie||[]).some(s => s.toLowerCase().includes(q)));
}

/* Estado actual de cada número de serie: en qué bodega está o si ya salió,
   reconstruido en orden cronológico de ingresos / traslados / salidas.
   Conserva el valorUnitario del ingreso original para poder calcular
   automáticamente el valor de las salidas. */
function serialesEstado(){
  const eventos = [...state.movimientos].sort((a,b)=> new Date(a.registradoEn) - new Date(b.registradoEn));
  const estado = {};
  for(const m of eventos){
    for(const s of (m.numerosSerie||[])){
      const key = s.toLowerCase();
      if(m.tipo === 'ingreso'){
        estado[key] = { serial: s, varianteId: m.varianteId, bodega: m.bodega, estado: 'en_stock', valorUnitario: m.valorUnitario, fechaIngreso: m.fecha };
      } else if(m.tipo === 'salida'){
        const prev = estado[key];
        estado[key] = { serial: s, varianteId: m.varianteId, bodega: null, estado: 'salido',
          valorUnitario: prev ? prev.valorUnitario : null, fechaIngreso: prev ? prev.fechaIngreso : null };
      } else if(m.tipo === 'traslado'){
        const prev = estado[key];
        estado[key] = { serial: s, varianteId: m.varianteId, bodega: m.bodegaDestino, estado: 'en_stock',
          valorUnitario: prev ? prev.valorUnitario : null, fechaIngreso: prev ? prev.fechaIngreso : null };
      }
    }
  }
  return estado;
}
function serialesEnStock(varianteId, bodega){
  const estado = serialesEstado();
  return Object.values(estado)
    .filter(e => e.varianteId===varianteId && e.estado==='en_stock' && (!bodega || e.bodega===bodega))
    .map(e => e.serial);
}
function ubicarSerial(serial){
  const estado = serialesEstado();
  return estado[(serial||'').trim().toLowerCase()] || null;
}
/* Busca series EN STOCK cuyo texto contenga la subcadena buscada (en el orden dado). */
function buscarSerialesDisponibles(query, opts){
  opts = opts || {};
  const q = (query||'').trim().toLowerCase();
  const estado = serialesEstado();
  let resultados = Object.values(estado).filter(e => e.estado === 'en_stock');
  if(opts.varianteId) resultados = resultados.filter(e => e.varianteId === opts.varianteId);
  if(q) resultados = resultados.filter(e => e.serial.toLowerCase().includes(q));
  return resultados.map(e => {
    const v = findVariante(e.varianteId);
    return { serial: e.serial, varianteId: e.varianteId, itemNombre: v?v.itemNombre:'—', sku: v?v.sku:'—',
              bodega: e.bodega, valorUnitario: e.valorUnitario };
  }).sort((a,b)=> a.serial.localeCompare(b.serial));
}
/* Para el panel principal usamos el valor SIN IVA (el IVA es un impuesto de paso,
   no forma parte del valor real del inventario). El valor CON IVA completo
   se conserva en cada movimiento y se muestra en los Excel exportables. */
function valorSinIvaDeIngreso(m){
  if(m.valorTotal == null) return null;
  return m.iva === 'si' ? Number(m.valorTotal) / 1.15 : Number(m.valorTotal);
}
/* Costo promedio estimado de una variante, calculado a partir de sus
   ingresos registrados. Se usa para estimar la ganancia en salidas SIN
   número de serie (donde no se puede rastrear el costo exacto por unidad). */
function costoPromedioVariante(varianteId){
  let total = 0, count = 0;
  for(const m of state.movimientos){
    if(m.tipo === 'ingreso' && m.varianteId === varianteId && m.valorUnitario != null){
      total += Number(m.valorUnitario); count++;
    }
  }
  return count > 0 ? total / count : null;
}
function valorTotalEnStock(){
  let total = 0;
  for(const m of state.movimientos){
    if(m.tipo === 'ingreso' && m.valorTotal != null) total += valorSinIvaDeIngreso(m);
    if(m.tipo === 'salida' && m.valorTotal) total -= Number(m.valorTotal);
  }
  return total;
}
function valorTotalSalidas(){
  let total = 0;
  for(const m of state.movimientos){
    if(m.tipo === 'salida' && m.ganancia != null) total += Number(m.ganancia);
  }
  return total;
}
function formatoMoneda(n){
  return '$' + (Number(n)||0).toLocaleString('es-EC', { minimumFractionDigits:2, maximumFractionDigits:2 });
}

function actualizarPreviewValor(prefix){
  const valorEl = document.getElementById(`${prefix}-valor`);
  const previewEl = document.getElementById(`${prefix}-preview`);
  if(!valorEl || !previewEl) return;
  const val = Number(valorEl.value) || 0;
  if(!val){ previewEl.innerHTML = ''; return; }
  const ivaEl = document.getElementById(`${prefix}-iva`);
  const modoEl = document.getElementById(`${prefix}-modovalor`);
  const iva = ivaEl ? ivaEl.value : 'no';
  const modo = modoEl ? modoEl.value : 'unitario';
  if(modo === 'total'){
    previewEl.innerHTML = `Valor total registrado: <b>${formatoMoneda(val)}</b>`;
    return;
  }
  const sinIva = val, conIva = val * 1.15;
  previewEl.innerHTML = `Valor del ítem sin IVA: <b style="${iva==='si'?'':'color:var(--warn)'}">${formatoMoneda(sinIva)}</b>`
    + ` &nbsp;·&nbsp; Valor del ítem con IVA (15%): <b style="${iva==='si'?'color:var(--warn)':''}">${formatoMoneda(conIva)}</b>`;
}
function bindCamposFinancierosYSerie(prefix){
  const valorEl = document.getElementById(`${prefix}-valor`);
  const ivaEl = document.getElementById(`${prefix}-iva`);
  const modoEl = document.getElementById(`${prefix}-modovalor`);
  const seriesEl = document.getElementById(`${prefix}-series`);
  const sinSerieEl = document.getElementById(`${prefix}-sinserie`);
  const refrescar = () => actualizarPreviewValor(prefix);
  if(valorEl) valorEl.addEventListener('input', refrescar);
  if(ivaEl) ivaEl.addEventListener('change', refrescar);
  if(modoEl) modoEl.addEventListener('change', refrescar);
  if(sinSerieEl && seriesEl){
    sinSerieEl.addEventListener('change', () => { seriesEl.disabled = sinSerieEl.checked; if(sinSerieEl.checked) seriesEl.value=''; });
  }
  refrescar();
}

function calcularValores(modoValor, valorInput, cantidad, iva){
  const val = Number(valorInput) || 0;
  if(!val) return { valorUnitario: null, valorTotal: null };
  if(modoValor === 'total'){
    const valorTotal = val;
    const valorUnitario = cantidad > 0 ? valorTotal / cantidad : null;
    return { valorUnitario, valorTotal };
  }
  const factor = iva === 'si' ? 1.15 : 1;
  const valorUnitario = val;
  const valorTotal = val * cantidad * factor;
  return { valorUnitario, valorTotal };
}

async function registrarMovimiento(m){
  const mov = {
    id: uid('m'),
    varianteId: m.varianteId,
    tipo: m.tipo,
    cantidad: Number(m.cantidad),
    fecha: m.fecha || todayStr(),
    registradoEn: new Date().toISOString(),
    usuario: state.currentUser.username,
    operador: m.operador || '',
    origen: m.origen,
    notas: m.notas || '',
    numerosSerie: m.numerosSerie || [],
    editado: false,
    historial: [],
  };
  if(m.tipo === 'traslado'){
    mov.bodegaOrigen = m.bodegaOrigen;
    mov.bodegaDestino = m.bodegaDestino;
  } else {
    mov.bodega = m.bodega || BODEGAS[0];
  }
  if(m.tipo === 'ingreso'){
    mov.proveedor = m.proveedor || '';
    mov.iva = m.iva || 'no';
  }
  if(m.tipo === 'ingreso' || m.tipo === 'salida'){
    mov.valorUnitario = (m.valorUnitario!=null && m.valorUnitario!=='') ? Number(m.valorUnitario) : null;
    mov.valorTotal = (m.valorTotal!=null && m.valorTotal!=='') ? Number(m.valorTotal) : null;
  }
  if(m.tipo === 'salida'){
    mov.precioVentaTotal = (m.precioVentaTotal!=null && m.precioVentaTotal!=='') ? Number(m.precioVentaTotal) : null;
    mov.ganancia = (m.ganancia!=null && m.ganancia!=='') ? Number(m.ganancia) : null;
    mov.factura = m.factura || '';
  }
  state.movimientos = [mov, ...state.movimientos];
  await storageSet(KEYS.movimientos, state.movimientos);
}

function bindLogin(){
  const btn = document.getElementById('login-btn');

    const u = uEl.value.trim();

  const variantes = allVariantes();
  const q = (state.filtro.texto||'').toLowerCase();
  const filtradas = variantes.filter(v =>
    !q || v.itemNombre.toLowerCase().includes(q) || v.sku.toLowerCase().includes(q) || v.descripcion.toLowerCase().includes(q)
  );
  return `
  <div class="panel">
    <div class="panel-head">

function renderSerieResults(q){
  if(!q || !q.trim()) return `<div style="color:var(--text-faint);font-size:12.5px;">Escribe o escanea un número de serie, o escribe un código de producto, para ver en qué movimientos aparece.</div>`;
  const qLower = q.trim().toLowerCase();
  const porSerie = buscarPorSerie(q);
  const porCodigo = state.movimientos.filter(m=>{
    const v = findVariante(m.varianteId);
    return v && v.sku.toLowerCase().includes(qLower);
  });
  const vistos = new Set();
  const resultados = [...porSerie, ...porCodigo].filter(m=>{
    if(vistos.has(m.id)) return false;
    vistos.add(m.id);
    return true;
  }).sort((a,b)=> new Date(b.registradoEn) - new Date(a.registradoEn));
  if(resultados.length===0) return `<div style="color:var(--text-faint);font-size:12.5px;">No se encontró ningún movimiento con esa serie o código.</div>`;
  return `<table>
    <thead><tr><th>Fecha</th><th>Ítem / Variante</th><th>Tipo</th><th>Cant.</th><th>Bodega</th><th>N° Serie</th><th>Usuario</th></tr></thead>
    <tbody>${resultados.map(m=>{
      const v = findVariante(m.varianteId);
      const bodegaTxt = m.tipo==='traslado'
        ? `${(m.bodegaOrigen||'').replace('Bodega ','')} → ${(m.bodegaDestino||'').replace('Bodega ','')}`
        : (m.bodega||'—');
      return `<tr>
        <td class="mono">${m.fecha}</td>
        <td>${v?`${v.itemNombre}<br/><span class="mono" style="color:var(--text-faint);font-size:11.5px;">${v.sku}</span>`:'—'}</td>
        <td><span class="tag ${m.tipo}">${tipoLabel(m.tipo)}</span></td>
        <td class="mono">${m.cantidad}</td>
        <td style="font-size:12px;">${bodegaTxt}</td>
        <td class="mono" style="color:var(--warn)">${(m.numerosSerie||[]).length ? (m.numerosSerie||[]).join(', ') : '—'}</td>
        <td>${m.usuario}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

/* ================= MOVIMIENTOS ================= */
function filtrarMovimientos(){
  const f = state.filtro;
  let lista = [...state.movimientos];
  if(f.itemId) lista = lista.filter(m=>{ const v=findVariante(m.varianteId); return v && v.itemId===f.itemId; });
  if(f.tipo) lista = lista.filter(m=>m.tipo===f.tipo);
  if(f.desde) lista = lista.filter(m=>m.fecha >= f.desde);
  if(f.hasta) lista = lista.filter(m=>m.fecha <= f.hasta);
  if(f.bodega) lista = lista.filter(m=> m.bodega===f.bodega || m.bodegaOrigen===f.bodega || m.bodegaDestino===f.bodega);
  if(f.serie){
    const q = f.serie.toLowerCase();
    lista = lista.filter(m=>{
      const bySerial = (m.numerosSerie||[]).some(s=>s.toLowerCase().includes(q));
      const v = findVariante(m.varianteId);
      const byCodigo = v && v.sku.toLowerCase().includes(q);
      return bySerial || byCodigo;
    });
  }
  return lista;
}

        <thead><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th></th></tr></thead>
        <tbody>
        ${state.users.map(u=>`<tr>
          <td>${u.nombre}</td>
          <td class="mono">${u.username}</td>
          <td><span class="tag ${u.role}">${u.role}</span></td>
          <td>${u.id!==state.currentUser.id ? `<button class="link-btn" data-del-user="${u.id}" style="color:var(--out)">Eliminar</button>` : `<span style="color:var(--text-faint);font-size:12px;">tú</span>`}</td>
        </tr>`).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

/* ================= EXPORTAR A EXCEL ================= */
function descargarExcel(filas, nombreHoja, nombreArchivo){
  if(typeof XLSX === 'undefined'){
    showToast('No se pudo cargar el módulo de Excel. Verifica tu conexión a internet.', true);
    return;
  }
  const ws = XLSX.utils.json_to_sheet(filas);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, nombreHoja);
  XLSX.writeFile(wb, nombreArchivo);
}

function exportarStockExcel(){
  const filas = allVariantes().map(v => {
    const s = calcStockPorBodega(v.id);
    const fila = {
      'Categoría': v.tipo, 'Ítem': v.itemNombre, 'Marca': v.marca,
      'SKU': v.sku, 'Descripción variante': v.descripcion,
    };
    BODEGAS.forEach(b => { fila[b] = s[b]; });
    fila['Total'] = s.total;
    fila['Números de serie en stock'] = serialesEnStock(v.id).join(', ');
    return fila;
  });
  descargarExcel(filas, 'Stock', `stock_${todayStr()}.xlsx`);
}

function exportarMovimientosExcel(lista){
  const verDinero = state.currentUser.role === 'admin';
  const filas = lista.map(m => {
    const v = findVariante(m.varianteId);
    const bodegaTxt = m.tipo==='traslado' ? '' : (m.bodega || '');
    const fila = {
      'Fecha': m.fecha, 'Ítem': v ? v.itemNombre : '(variante eliminada)', 'SKU': v ? v.sku : '',
      'Tipo': m.tipo === 'ingreso' ? 'Ingreso' : m.tipo === 'salida' ? 'Salida' : 'Traslado',
      'Cantidad': m.cantidad,
      'Bodega': bodegaTxt,
      'Bodega origen (traslado)': m.bodegaOrigen || '',
      'Bodega destino (traslado)': m.bodegaDestino || '',
      'Números de serie': (m.numerosSerie||[]).join(', '),
    };
    if(verDinero){
      fila['Proveedor'] = m.proveedor || '';
      fila['Graba IVA'] = m.iva === 'si' ? 'Sí' : (m.iva === 'no' ? 'No' : '');
      fila['Valor unitario'] = m.valorUnitario!=null ? m.valorUnitario : '';
      fila['Valor total sin IVA'] = m.tipo==='ingreso' && m.valorTotal!=null ? valorSinIvaDeIngreso(m) : (m.valorTotal!=null?m.valorTotal:'');
      fila['Valor total con IVA'] = m.tipo==='ingreso' && m.valorTotal!=null ? Number(m.valorTotal) : '';
      fila['Factura/Comprobante'] = m.factura || '';
      fila['Precio de Venta'] = m.precioVentaTotal!=null ? m.precioVentaTotal : '';
      fila['Ganancia'] = m.ganancia!=null ? m.ganancia : '';
    }
    fila['Origen'] = m.origen === 'scanner' ? 'Pistola' : 'Manual';
    fila['Usuario'] = m.usuario;
    fila['Operador'] = m.operador || '';
    fila['Notas'] = m.notas || '';
    fila['Editado'] = m.editado ? 'Sí' : 'No';
    return fila;
  });
  descargarExcel(filas, 'Movimientos', `movimientos_${todayStr()}.xlsx`);
}

function bindMovForm(tipo){
  const isIn = tipo === 'ingreso';
  const workBodegaSel = document.getElementById(`work-bodega-${tipo}`);
  if(workBodegaSel) workBodegaSel.onchange = () => { state.workBodega[tipo] = workBodegaSel.value; render(); };

  const scanInput = document.getElementById(`scan-input-${tipo}`);
  if(scanInput){
    scanInput.focus();
    scanInput.addEventListener('input', e => { state.scanBuffer[tipo] = e.target.value; });
    scanInput.addEventListener('keydown', e => {
      if(e.key !== 'Enter') return;
      e.preventDefault();
      const code = scanInput.value.trim();
      if(!code) return;
      const v = findVarianteBySku(code);
      if(!v){
        showToast(`Código "${code}" no encontrado en el catálogo.`, true);
        state.scanBuffer[tipo] = '';
        return;
      }
      state.pendingScan[tipo] = { ...v, cantidad: 1 };
      state.scanBuffer[tipo] = '';
      render();
      setTimeout(()=>{ const c = document.getElementById(`scan-cant-${tipo}`); if(c){ c.focus(); c.select(); } }, 0);
    });
  }

  const confirmBtn = document.getElementById(`scan-confirm-${tipo}`);
  if(confirmBtn){
    bindCamposFinancierosYSerie(`scan-${tipo}`);
    const doConfirm = async () => {
      const cantEl = document.getElementById(`scan-cant-${tipo}`);
      const cant = Number(cantEl.value) || 1;
      const seriesEl = document.getElementById(`scan-series-${tipo}`);
      const sinSerieEl = document.getElementById(`scan-${tipo}-sinserie`);
      const notasEl = document.getElementById(`scan-notas-${tipo}`);
      const modoValorEl = document.getElementById(`scan-${tipo}-modovalor`);
      const valorEl = document.getElementById(`scan-${tipo}-valor`);
      const ivaEl = document.getElementById(`scan-${tipo}-iva`);
      const proveedorEl = document.getElementById(`scan-${tipo}-proveedor`);
      const operadorEl = document.getElementById(`scan-${tipo}-operador`);
      const codigoOperadorEl = document.getElementById(`scan-${tipo}-codigo-operador`);
      const iva = ivaEl ? ivaEl.value : 'no';
      const operador = operadorEl ? operadorEl.value : '';
      if(!operador){ showToast('Debes seleccionar el Operador que realiza este ingreso.', true); return; }
      if(!validarCodigoOperador(operador, codigoOperadorEl ? codigoOperadorEl.value : '')){
        showToast('Código de operador incorrecto o vacío.', true); return;
      }
      const series = parseSeries(seriesEl ? seriesEl.value : '');
      if(series.length===0 && !(sinSerieEl && sinSerieEl.checked)){
        showToast('El número de serie es obligatorio. Marca "Equipo sin seriado" si este producto no tiene serie.', true);
        return;
      }
      const { valorUnitario, valorTotal } = calcularValores(modoValorEl.value, valorEl.value, cant, iva);
      const p = state.pendingScan[tipo];
      await registrarMovimiento({
        varianteId: p.id, tipo, cantidad: cant, fecha: todayStr(), origen: 'scanner',
        bodega: state.workBodega[tipo], numerosSerie: series,
        notas: notasEl ? notasEl.value : '', iva, operador,
        proveedor: proveedorEl ? proveedorEl.value : '',
        valorUnitario, valorTotal,
      });
      state.pendingScan[tipo] = null;
      showToast(`Ingreso registrado: ${cant} × ${p.sku}`);
      render();
      setTimeout(()=>{ const s=document.getElementById(`scan-input-${tipo}`); if(s) s.focus(); },0);
    };
    confirmBtn.onclick = doConfirm;
  }
  const cancelBtn = document.getElementById(`scan-cancel-${tipo}`);
  if(cancelBtn) cancelBtn.onclick = () => { state.pendingScan[tipo] = null; render(); };

  const codigoEl = document.getElementById(`manual-codigo-${tipo}`);
  if(codigoEl){
    codigoEl.addEventListener('input', () => {
      state.manualForm[tipo].codigo = codigoEl.value;
      const previewEl = document.getElementById(`manual-codigo-preview-${tipo}`);
      if(!previewEl) return;
      const code = codigoEl.value.trim();
      if(!code){ previewEl.innerHTML = ''; return; }
      const match = findVarianteBySku(code);
      previewEl.innerHTML = match
        ? `<span style="color:var(--in);">✓ ${match.itemNombre} — ${match.descripcion}${match.precioVenta!=null?' · PVP '+formatoMoneda(match.precioVenta):''}</span>`
        : `<span style="color:var(--out);">No se encontró ese código. Créalo primero en "Producto".</span>`;
    });
  }

  bindCamposFinancierosYSerie(`manual-${tipo}`);

  const submitBtn = document.getElementById(`manual-submit-${tipo}`);
  if(submitBtn) submitBtn.onclick = async () => {
    const codigo = document.getElementById(`manual-codigo-${tipo}`).value.trim();
    const match = findVarianteBySku(codigo);
    const cantidad = Number(document.getElementById(`manual-cant-${tipo}`).value) || 0;
    const fecha = document.getElementById(`manual-fecha-${tipo}`).value || todayStr();
    const notas = document.getElementById(`manual-notas-${tipo}`).value;
    const bodega = document.getElementById(`manual-bodega-${tipo}`).value;
    const seriesEl = document.getElementById(`manual-${tipo}-series`);
    const sinSerieEl = document.getElementById(`manual-${tipo}-sinserie`);
    const series = parseSeries(seriesEl.value);
    const modoValorEl = document.getElementById(`manual-${tipo}-modovalor`);
    const valorEl = document.getElementById(`manual-${tipo}-valor`);
    const ivaEl = document.getElementById(`manual-${tipo}-iva`);
    const proveedorEl = document.getElementById(`manual-${tipo}-proveedor`);
    const operadorEl = document.getElementById(`manual-${tipo}-operador`);
    const codigoOperadorEl = document.getElementById(`manual-${tipo}-codigo-operador`);
    const iva = ivaEl ? ivaEl.value : 'no';
    const operador = operadorEl ? operadorEl.value : '';
    if(!codigo || !match){ showToast('Escribe un código de producto válido (debe existir en "Producto").', true); return; }
    if(cantidad <= 0){ showToast('La cantidad debe ser mayor a 0.', true); return; }
    if(!operador){ showToast('Debes seleccionar el Operador que realiza este ingreso.', true); return; }
    if(!validarCodigoOperador(operador, codigoOperadorEl ? codigoOperadorEl.value : '')){
      showToast('Código de operador incorrecto o vacío.', true); return;
    }
    if(series.length===0 && !(sinSerieEl && sinSerieEl.checked)){
      showToast('El número de serie es obligatorio. Marca "Equipo sin seriado" si este producto no tiene serie.', true);
      return;
    }
    const { valorUnitario, valorTotal } = calcularValores(modoValorEl.value, valorEl.value, cantidad, iva);
    await registrarMovimiento({
      varianteId: match.id, tipo, cantidad, fecha, notas, origen: 'manual', bodega, numerosSerie: series,
      iva, operador, proveedor: proveedorEl ? proveedorEl.value : '', valorUnitario, valorTotal,
    });
    state.manualForm[tipo] = { codigo: '', varianteId: '', cantidad: 1, fecha: todayStr(), notas: '', numerosSerie: '',
      proveedor: '', iva: 'no', modoValor: 'unitario', valor: '', operador: '' };
    showToast('Ingreso registrado correctamente.');
    render();
  };
}

function bindSalida(){
  const s = state.salida;
  const bodegaSel = document.getElementById('salida-bodega');
  if(bodegaSel) bodegaSel.onchange = () => { s.bodega = bodegaSel.value; render(); };

  const busquedaEl = document.getElementById('salida-busqueda');
  if(busquedaEl){
    busquedaEl.focus();
    busquedaEl.setSelectionRange(busquedaEl.value.length, busquedaEl.value.length);
    busquedaEl.oninput = () => { s.busqueda = busquedaEl.value; render(); };
  }

  document.querySelectorAll('[data-agregar-salida]').forEach(btn => {
    btn.onclick = () => {
      const serial = btn.getAttribute('data-agregar-salida');
      const ubic = ubicarSerial(serial);
      if(!ubic || ubic.estado !== 'en_stock'){ showToast('Ese equipo ya no está disponible en stock.', true); render(); return; }
      if(ubic.bodega !== s.bodega){ showToast(`Ese equipo está en ${ubic.bodega}. Debes hacer un traslado primero.`, true); render(); return; }
      if(s.cola.some(c=>c.serial.toLowerCase()===serial.toLowerCase())) return;
      const v = findVariante(ubic.varianteId);
      s.cola = [...s.cola, { serial, varianteId: ubic.varianteId, itemNombre: v?v.itemNombre:'—', sku: v?v.sku:'—' }];
      render();
    };
  });

  document.querySelectorAll('[data-quitar-salida]').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.getAttribute('data-quitar-salida'));
      s.cola = s.cola.filter((_,i)=>i!==idx);
      render();
    };
  });

  const notasEl = document.getElementById('salida-notas');
  if(notasEl) notasEl.oninput = () => { s.notas = notasEl.value; };

  const actualizarGananciaPreview = () => {
    const previewEl = document.getElementById('salida-ganancia-preview');
    if(!previewEl) return;
    const modoEl = document.getElementById('salida-modoventa');
    const precioEl = document.getElementById('salida-precioventa');
    if(!modoEl || !precioEl){ previewEl.innerHTML=''; return; }
    const precio = Number(precioEl.value) || 0;
    if(!precio || s.cola.length===0){ previewEl.innerHTML=''; return; }
    const precioVentaTotal = modoEl.value==='total' ? precio : precio * s.cola.length;
    let costoTotal = 0, algunCosto = false;
    for(const c of s.cola){
      const ubic = ubicarSerial(c.serial);
      if(ubic && ubic.valorUnitario != null){ costoTotal += Number(ubic.valorUnitario); algunCosto = true; }
    }
    const ganancia = precioVentaTotal - costoTotal;
    previewEl.innerHTML = `Venta: <b>${formatoMoneda(precioVentaTotal)}</b> · Costo: <b>${algunCosto?formatoMoneda(costoTotal):'desconocido'}</b> · Ganancia estimada: <b style="color:${ganancia>=0?'var(--in)':'var(--out)'}">${formatoMoneda(ganancia)}</b>`;
  };
  const modoVentaEl = document.getElementById('salida-modoventa');
  const precioVentaEl = document.getElementById('salida-precioventa');
  if(modoVentaEl) modoVentaEl.addEventListener('change', () => { s.modoVenta = modoVentaEl.value; actualizarGananciaPreview(); });
  if(precioVentaEl) precioVentaEl.addEventListener('input', () => { s.precioVenta = precioVentaEl.value; actualizarGananciaPreview(); });
  actualizarGananciaPreview();

  const vaciarBtn = document.getElementById('salida-vaciar');
  if(vaciarBtn) vaciarBtn.onclick = () => { s.cola = []; s.notas = ''; s.precioVenta = ''; render(); };

  const confirmarBtn = document.getElementById('salida-confirmar');
  if(confirmarBtn) confirmarBtn.onclick = async () => {
    const modoEl = document.getElementById('salida-modoventa');
    const precioEl = document.getElementById('salida-precioventa');
    const facturaEl = document.getElementById('salida-factura');
    const operadorEl = document.getElementById('salida-operador');
    const codigoOperadorEl = document.getElementById('salida-codigo-operador');
    const factura = facturaEl ? facturaEl.value.trim() : '';
    const operador = operadorEl ? operadorEl.value : '';
    if(!factura){ showToast('Debes indicar la Factura/Comprobante de esta salida.', true); return; }
    if(!operador){ showToast('Debes seleccionar el Operador que realiza esta salida.', true); return; }
    if(!validarCodigoOperador(operador, codigoOperadorEl ? codigoOperadorEl.value : '')){
      showToast('Código de operador incorrecto o vacío.', true); return;
    }
    const precio = Number(precioEl.value) || 0;
    const precioVentaTotalGlobal = precio ? (modoEl.value==='total' ? precio : precio * s.cola.length) : 0;
    const precioUnitarioPromedio = precio ? precioVentaTotalGlobal / s.cola.length : 0;

    const grupos = {};
    for(const c of s.cola){
      if(!grupos[c.varianteId]) grupos[c.varianteId] = [];
      grupos[c.varianteId].push(c.serial);
    }
    for(const varianteId in grupos){
      const seriales = grupos[varianteId];
      let costoTotal = 0, algunCosto = false;
      for(const serial of seriales){
        const ubic = ubicarSerial(serial);
        if(ubic && ubic.valorUnitario != null){ costoTotal += Number(ubic.valorUnitario); algunCosto = true; }
      }
      const ventaTotalGrupo = precio ? precioUnitarioPromedio * seriales.length : null;
      const ganancia = (precio && algunCosto) ? (ventaTotalGrupo - costoTotal) : null;
      await registrarMovimiento({
        varianteId, tipo: 'salida', cantidad: seriales.length, fecha: todayStr(), origen: 'manual',
        bodega: s.bodega, numerosSerie: seriales, notas: s.notas, factura, operador,
        valorUnitario: null, valorTotal: algunCosto ? costoTotal : null,
        precioVentaTotal: ventaTotalGrupo, ganancia,
      });
    }
    showToast(`Salida registrada: ${s.cola.length} equipo(s).`);
    s.cola = []; s.notas = ''; s.busqueda = ''; s.precioVenta = ''; s.factura = ''; s.operador = '';
    render();
  };

  const facturaEl = document.getElementById('salida-factura');
  if(facturaEl) facturaEl.oninput = () => { s.factura = facturaEl.value; };
  const operadorEl = document.getElementById('salida-operador');
  if(operadorEl) operadorEl.onchange = () => { s.operador = operadorEl.value; };

  const bulkItemSel = document.getElementById('salida-bulk-item');
  if(bulkItemSel) bulkItemSel.onchange = () => { s.bulk.itemId = bulkItemSel.value; s.bulk.varianteId = ''; render(); };
  const bulkVarSel = document.getElementById('salida-bulk-variante');
  if(bulkVarSel) bulkVarSel.onchange = () => { s.bulk.varianteId = bulkVarSel.value; };
  const bulkFacturaEl = document.getElementById('salida-bulk-factura');
  if(bulkFacturaEl) bulkFacturaEl.oninput = () => { s.bulk.factura = bulkFacturaEl.value; };
  const bulkOperadorEl = document.getElementById('salida-bulk-operador');
  if(bulkOperadorEl) bulkOperadorEl.onchange = () => { s.bulk.operador = bulkOperadorEl.value; };

  const actualizarGananciaBulkPreview = () => {
    const previewEl = document.getElementById('salida-bulk-ganancia-preview');
    if(!previewEl) return;
    const modoEl = document.getElementById('salida-bulk-modoventa');
    const precioEl = document.getElementById('salida-bulk-precioventa');
    const cantEl = document.getElementById('salida-bulk-cant');
    if(!modoEl || !precioEl || !cantEl){ previewEl.innerHTML=''; return; }
    const precio = Number(precioEl.value) || 0;
    const cantidad = Number(cantEl.value) || 0;
    if(!precio || !cantidad || !s.bulk.varianteId){ previewEl.innerHTML=''; return; }
    const precioVentaTotal = modoEl.value==='total' ? precio : precio * cantidad;
    const costoProm = costoPromedioVariante(s.bulk.varianteId);
    if(costoProm == null){
      previewEl.innerHTML = `Venta: <b>${formatoMoneda(precioVentaTotal)}</b> · Costo: <b>desconocido</b> (sin ingresos con valor registrado para este producto)`;
      return;
    }
    const costoTotal = costoProm * cantidad;
    const ganancia = precioVentaTotal - costoTotal;
    previewEl.innerHTML = `Venta: <b>${formatoMoneda(precioVentaTotal)}</b> · Costo estimado: <b>${formatoMoneda(costoTotal)}</b> · Ganancia estimada: <b style="color:${ganancia>=0?'var(--in)':'var(--out)'}">${formatoMoneda(ganancia)}</b>`;
  };
  const bulkModoVentaEl = document.getElementById('salida-bulk-modoventa');
  const bulkPrecioVentaEl = document.getElementById('salida-bulk-precioventa');
  if(bulkModoVentaEl) bulkModoVentaEl.addEventListener('change', () => { s.bulk.modoVenta = bulkModoVentaEl.value; actualizarGananciaBulkPreview(); });
  if(bulkPrecioVentaEl) bulkPrecioVentaEl.addEventListener('input', () => { s.bulk.precioVenta = bulkPrecioVentaEl.value; actualizarGananciaBulkPreview(); });
  const bulkCantEl = document.getElementById('salida-bulk-cant');
  if(bulkCantEl) bulkCantEl.addEventListener('input', actualizarGananciaBulkPreview);
  actualizarGananciaBulkPreview();

  const bulkSubmit = document.getElementById('salida-bulk-submit');
  if(bulkSubmit) bulkSubmit.onclick = async () => {
    const varianteId = document.getElementById('salida-bulk-variante').value;
    const cantidad = Number(document.getElementById('salida-bulk-cant').value) || 0;
    const factura = document.getElementById('salida-bulk-factura').value.trim();
    const operador = document.getElementById('salida-bulk-operador').value;
    const codigoOperadorEl = document.getElementById('salida-bulk-codigo-operador');
    const modoEl = document.getElementById('salida-bulk-modoventa');
    const precioEl = document.getElementById('salida-bulk-precioventa');
    if(!varianteId){ showToast('Selecciona un ítem y una variante.', true); return; }
    if(cantidad <= 0){ showToast('La cantidad debe ser mayor a 0.', true); return; }
    if(!factura){ showToast('Debes indicar la Factura/Comprobante de esta salida.', true); return; }
    if(!operador){ showToast('Debes seleccionar el Operador que realiza esta salida.', true); return; }
    if(!validarCodigoOperador(operador, codigoOperadorEl ? codigoOperadorEl.value : '')){
      showToast('Código de operador incorrecto o vacío.', true); return;
    }
    const stockEnBodega = calcStock(varianteId, s.bodega);
    if(cantidad > stockEnBodega){
      showToast(`Solo hay ${stockEnBodega} unidad(es) de esa variante en ${s.bodega}.`, true); return;
    }
    const precio = Number(precioEl.value) || 0;
    const precioVentaTotal = precio ? (modoEl.value==='total' ? precio : precio * cantidad) : null;
    const costoProm = costoPromedioVariante(varianteId);
    const costoTotal = (precio && costoProm != null) ? costoProm * cantidad : null;
    const ganancia = (precioVentaTotal != null && costoTotal != null) ? precioVentaTotal - costoTotal : null;
    await registrarMovimiento({
      varianteId, tipo: 'salida', cantidad, fecha: todayStr(), origen: 'manual',
      bodega: s.bodega, numerosSerie: [], notas: '', valorUnitario: null, valorTotal: costoTotal,
      factura, operador, precioVentaTotal, ganancia,
    });
    s.bulk = { itemId: '', varianteId: '', cantidad: 1, factura: '', operador: '', modoVenta: 'unitario', precioVenta: '' };
    showToast('Salida registrada correctamente.');
    render();
  };
}

      const serial = btn.getAttribute('data-agregar-traslado');
      const ubic = ubicarSerial(serial);
      if(!ubic || ubic.estado !== 'en_stock'){ showToast('Ese equipo ya no está disponible en stock.', true); render(); return; }
      if(ubic.bodega === t.bodegaDestino){ showToast(`Ese equipo ya está en ${t.bodegaDestino}.`, true); render(); return; }
      if(t.cola.some(c=>c.serial.toLowerCase()===serial.toLowerCase())) return;
      const v = findVariante(ubic.varianteId);
      t.cola = [...t.cola, { serial, varianteId: ubic.varianteId, itemNombre: v?v.itemNombre:'—', sku: v?v.sku:'—', bodegaOrigen: ubic.bodega }];
      render();
    };
  });

  const scanInput = document.getElementById('traslado-scan-input');
  document.querySelectorAll('[data-quitar-cola]').forEach(btn => {
    btn.onclick = () => {
      const idx = Number(btn.getAttribute('data-quitar-cola'));
      t.cola = t.cola.filter((_,i)=>i!==idx);
      render();
    };
  });

  const notasEl = document.getElementById('traslado-notas');
  if(notasEl) notasEl.oninput = () => { t.notas = notasEl.value; };
  const operadorEl = document.getElementById('traslado-operador');
  if(operadorEl) operadorEl.onchange = () => { t.operador = operadorEl.value; };

  const vaciarBtn = document.getElementById('traslado-vaciar');
  if(vaciarBtn) vaciarBtn.onclick = () => { t.cola = []; t.notas = ''; t.operador = ''; render(); };

  const confirmarBtn = document.getElementById('traslado-confirmar');
  if(confirmarBtn) confirmarBtn.onclick = async () => {
    const operadorSel = document.getElementById('traslado-operador');
    const codigoOperadorEl = document.getElementById('traslado-codigo-operador');
    const operador = operadorSel ? operadorSel.value : '';
    if(!operador){ showToast('Debes seleccionar el Operador que realiza este traslado.', true); return; }
    if(!validarCodigoOperador(operador, codigoOperadorEl ? codigoOperadorEl.value : '')){
      showToast('Código de operador incorrecto o vacío.', true); return;
    }
    const grupos = {};
    for(const c of t.cola){
      const key = c.varianteId + '|' + c.bodegaOrigen;
      if(!grupos[key]) grupos[key] = { varianteId: c.varianteId, bodegaOrigen: c.bodegaOrigen, seriales: [] };
      grupos[key].seriales.push(c.serial);
    }
    for(const key in grupos){
      const g = grupos[key];
      await registrarMovimiento({
        varianteId: g.varianteId, tipo: 'traslado', cantidad: g.seriales.length,
        fecha: todayStr(), origen: 'scanner', bodegaOrigen: g.bodegaOrigen,
        bodegaDestino: t.bodegaDestino, numerosSerie: g.seriales, notas: t.notas, operador,
      });
    }
    showToast(`Traslado registrado: ${t.cola.length} equipo(s) a ${t.bodegaDestino}.`);
    t.cola = []; t.notas = ''; t.operador = '';
    render();
  };

  const bulkItemSel = document.getElementById('traslado-bulk-item');
  if(bulkItemSel) bulkItemSel.onchange = () => { t.bulk.itemId = bulkItemSel.value; t.bulk.varianteId = ''; render(); };
  const bulkVarSel = document.getElementById('traslado-bulk-variante');
  if(bulkVarSel) bulkVarSel.onchange = () => { t.bulk.varianteId = bulkVarSel.value; };
  const bulkOrigenSel = document.getElementById('traslado-bulk-origen');
  if(bulkOrigenSel) bulkOrigenSel.onchange = () => { t.bulk.bodegaOrigen = bulkOrigenSel.value; render(); };
  const bulkCantEl = document.getElementById('traslado-bulk-cant');
  if(bulkCantEl) bulkCantEl.oninput = () => { t.bulk.cantidad = bulkCantEl.value; };
  const bulkOperadorEl = document.getElementById('traslado-bulk-operador');
  if(bulkOperadorEl) bulkOperadorEl.onchange = () => { t.bulk.operador = bulkOperadorEl.value; };
  const bulkNotasEl = document.getElementById('traslado-bulk-notas');
  if(bulkNotasEl) bulkNotasEl.oninput = () => { t.bulk.notas = bulkNotasEl.value; };

  const bulkSubmit = document.getElementById('traslado-bulk-submit');
  if(bulkSubmit) bulkSubmit.onclick = async () => {
    const varianteId = document.getElementById('traslado-bulk-variante').value;
    const bodegaOrigen = document.getElementById('traslado-bulk-origen').value;
    const cantidad = Number(document.getElementById('traslado-bulk-cant').value) || 0;
    const operador = document.getElementById('traslado-bulk-operador').value;
    const codigoOperadorEl = document.getElementById('traslado-bulk-codigo-operador');
    const notas = document.getElementById('traslado-bulk-notas').value;
    if(!varianteId){ showToast('Selecciona un ítem y una variante.', true); return; }
    if(bodegaOrigen === t.bodegaDestino){ showToast('La bodega origen y destino no pueden ser la misma.', true); return; }
    if(cantidad <= 0){ showToast('La cantidad debe ser mayor a 0.', true); return; }
    if(!operador){ showToast('Debes seleccionar el Operador que realiza este traslado.', true); return; }
    if(!validarCodigoOperador(operador, codigoOperadorEl ? codigoOperadorEl.value : '')){
      showToast('Código de operador incorrecto o vacío.', true); return;
    }
    const stockEnOrigen = calcStock(varianteId, bodegaOrigen);
    if(cantidad > stockEnOrigen){
      showToast(`Solo hay ${stockEnOrigen} unidad(es) de esa variante en ${bodegaOrigen}.`, true); return;
    }
    await registrarMovimiento({
      varianteId, tipo: 'traslado', cantidad, fecha: todayStr(), origen: 'manual',
      bodegaOrigen, bodegaDestino: t.bodegaDestino, numerosSerie: [], notas, operador,
    });
    t.bulk = { itemId: '', varianteId: '', bodegaOrigen: BODEGAS[0], cantidad: 1, operador: '', notas: '' };
    showToast('Traslado registrado correctamente.');
    render();
  };
}

function bindStock(){
  const s = document.getElementById('stock-search');
  if(s){
    s.oninput = () => { state.filtro.texto = s.value; render(); setTimeout(()=>{ const el=document.getElementById('stock-search'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} },0); };
  }
  const serieInput = document.getElementById('serie-search');
  if(serieInput){
    serieInput.oninput = () => {
      state.filtro.serieStock = serieInput.value;
      document.getElementById('serie-results').innerHTML = renderSerieResults(serieInput.value);
    };
  }
  const exportBtn = document.getElementById('export-stock-btn');
  if(exportBtn) exportBtn.onclick = exportarStockExcel;
}

function bindMovimientos(){
  const iSel = document.getElementById('filtro-item');
  const tSel = document.getElementById('filtro-tipo');
  const bSel = document.getElementById('filtro-bodega');
  const dEl = document.getElementById('filtro-desde');
  const hEl = document.getElementById('filtro-hasta');
  const sEl = document.getElementById('filtro-serie');
  if(iSel) iSel.onchange = () => { state.filtro.itemId = iSel.value; render(); };
  if(tSel) tSel.onchange = () => { state.filtro.tipo = tSel.value; render(); };
  if(bSel) bSel.onchange = () => { state.filtro.bodega = bSel.value; render(); };
  if(dEl) dEl.onchange = () => { state.filtro.desde = dEl.value; render(); };
  if(hEl) hEl.onchange = () => { state.filtro.hasta = hEl.value; render(); };
  if(sEl) sEl.oninput = () => { state.filtro.serie = sEl.value; render(); setTimeout(()=>{ const el=document.getElementById('filtro-serie'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length);} },0); };
  const limpiar = document.getElementById('filtro-limpiar');
  if(limpiar) limpiar.onclick = () => { state.filtro = { itemId:'', tipo:'', desde:'', hasta:'', texto:'', bodega:'', serie:'' }; render(); };
  const exportBtn = document.getElementById('export-mov-btn');
  if(exportBtn) exportBtn.onclick = () => exportarMovimientosExcel(filtrarMovimientos());

  document.querySelectorAll('[data-edit-mov]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.getAttribute('data-edit-mov');
      const mov = state.movimientos.find(m=>m.id===id);
      state.editingMov = mov;
      state.editForm = { tipo: mov.tipo, cantidad: mov.cantidad, fecha: mov.fecha, notas: mov.notas,
        bodega: mov.bodega, bodegaOrigen: mov.bodegaOrigen, bodegaDestino: mov.bodegaDestino,
        numerosSerie: mov.numerosSerie, proveedor: mov.proveedor, iva: mov.iva,
        valorUnitario: mov.valorUnitario, valorTotal: mov.valorTotal,
        precioVentaTotal: mov.precioVentaTotal, ganancia: mov.ganancia };
      render();
    };
  });
}

function bindEditModal(){
  const close = () => { state.editingMov = null; state.editForm = null; render(); };
  document.getElementById('modal-close').onclick = close;
  document.getElementById('modal-cancel').onclick = close;
  document.getElementById('modal-overlay').addEventListener('click', e => { if(e.target.id === 'modal-overlay') close(); });
  document.getElementById('modal-save').onclick = async () => {
    const m = state.editingMov;
    const esTraslado = m.tipo === 'traslado';
    const previo = { tipo: m.tipo, cantidad: m.cantidad, fecha: m.fecha, notas: m.notas,
      bodega: m.tipo==='traslado' ? `${m.bodegaOrigen} → ${m.bodegaDestino}` : m.bodega,
      numerosSerie: m.numerosSerie };

    const nuevaCant = Number(document.getElementById('edit-cant').value) || m.cantidad;
    const nuevaFecha = document.getElementById('edit-fecha').value || m.fecha;
    const nuevasNotas = document.getElementById('edit-notas').value;
    const nuevasSeries = parseSeries(document.getElementById('edit-series').value);
    const motivo = document.getElementById('edit-motivo').value;

    m.cantidad = nuevaCant; m.fecha = nuevaFecha; m.notas = nuevasNotas; m.numerosSerie = nuevasSeries;

    if(esTraslado){
      m.bodegaOrigen = document.getElementById('edit-bodega-origen').value;
      m.bodegaDestino = document.getElementById('edit-bodega-destino').value;
    } else {
      const nuevoTipo = document.getElementById('edit-tipo').value;
      m.tipo = nuevoTipo;
      m.bodega = document.getElementById('edit-bodega').value;
      const valorUnitarioEl = document.getElementById('edit-valor-unitario');
      const valorTotalEl = document.getElementById('edit-valor-total');
      m.valorUnitario = valorUnitarioEl.value !== '' ? Number(valorUnitarioEl.value) : null;
      m.valorTotal = valorTotalEl.value !== '' ? Number(valorTotalEl.value) : null;
      if(nuevoTipo === 'ingreso'){
        const proveedorEl = document.getElementById('edit-proveedor');
        const ivaEl = document.getElementById('edit-iva');
        m.proveedor = proveedorEl ? proveedorEl.value : m.proveedor;
        m.iva = ivaEl ? ivaEl.value : m.iva;
      }
      if(nuevoTipo === 'salida'){
        const precioVentaEl = document.getElementById('edit-precio-venta');
        const gananciaEl = document.getElementById('edit-ganancia');
        m.precioVentaTotal = precioVentaEl && precioVentaEl.value !== '' ? Number(precioVentaEl.value) : null;
        m.ganancia = gananciaEl && gananciaEl.value !== '' ? Number(gananciaEl.value) : null;
      }
    }
    m.historial = [ { fecha: nowStr(), usuario: state.currentUser.username, motivo, previo }, ...m.historial ];
    m.editado = true;

    state.movimientos = state.movimientos.map(x => x.id===m.id ? m : x);
    await storageSet(KEYS.movimientos, state.movimientos);
    showToast('Movimiento actualizado y registrado en el historial.');
    close();
  };
}

function bindCatalogo(){
  const verProductoSel = document.getElementById('ver-producto-select');
  if(verProductoSel) verProductoSel.onchange = () => { state.itemSeleccionado = verProductoSel.value; render(); };

  const addCatBtn = document.getElementById('add-categoria-btn');
  if(addCatBtn) addCatBtn.onclick = async () => {
    const input = document.getElementById('new-categoria');
    const nombre = input.value.trim().toLowerCase();
    if(!nombre){ showToast('Escribe un nombre de categoría.', true); return; }
    if(state.categorias.some(c=>c.toLowerCase()===nombre)){ showToast('Esa categoría ya existe.', true); return; }
    state.categorias = [...state.categorias, nombre];
    await storageSet(KEYS.categorias, state.categorias);
    state.newCategoria = '';
    showToast('Categoría agregada.');
    render();
  };
  document.querySelectorAll('[data-del-categoria]').forEach(btn => {
    btn.onclick = async () => {
      const cat = btn.getAttribute('data-del-categoria');
      state.categorias = state.categorias.filter(c=>c!==cat);
      await storageSet(KEYS.categorias, state.categorias);
      render();
    };
  });

  const addItemBtn = document.getElementById('add-item-btn');
  if(addItemBtn) addItemBtn.onclick = async () => {
    const tipo = document.getElementById('new-item-tipo').value;
    const nombre = document.getElementById('new-item-nombre').value.trim();
    const marca = document.getElementById('new-item-marca').value.trim();
    if(!nombre){ showToast('Ingresa un nombre para el ítem.', true); return; }
    state.catalogo = [...state.catalogo, { id: uid('it'), tipo, nombre, marca, variantes: [] }];
    await storageSet(KEYS.catalogo, state.catalogo);
    state.newItem = { tipo: state.categorias[0] || '', nombre:'', marca:'' };
    showToast('Ítem agregado al catálogo.');
    render();
  };

  document.querySelectorAll('[data-add-variante]').forEach(btn => {
    btn.onclick = async () => {
      const itemId = btn.getAttribute('data-add-variante');
      const sku = document.getElementById(`nv-sku-${itemId}`).value.trim();
      const desc = document.getElementById(`nv-desc-${itemId}`).value.trim();
      const pvpEl = document.getElementById(`nv-pvp-${itemId}`);
      const ivaEl = document.getElementById(`nv-iva-${itemId}`);
      const precioVenta = pvpEl.value !== '' ? Number(pvpEl.value) : null;
      const gravaIva = ivaEl.value;
      if(!sku || !desc){ showToast('Completa el código y la descripción.', true); return; }
      if(findVarianteBySku(sku)){ showToast('Ya existe un producto con ese código.', true); return; }
      state.catalogo = state.catalogo.map(it => it.id===itemId
        ? { ...it, variantes: [...it.variantes, { id: uid('v'), sku, descripcion: desc, precioVenta, gravaIva }] }
        : it);
      await storageSet(KEYS.catalogo, state.catalogo);
      showToast('Producto registrado.');
      render();
    };
  });

  document.querySelectorAll('[data-del-variante]').forEach(btn => {
    btn.onclick = async () => {
      const [itemId, varianteId] = btn.getAttribute('data-del-variante').split('|');
      if(movimientosDeVariante(varianteId).length > 0){
        showToast('No se puede eliminar: esta variante ya tiene movimientos registrados.', true);
        return;
      }
      state.catalogo = state.catalogo.map(it => it.id===itemId
        ? { ...it, variantes: it.variantes.filter(v=>v.id!==varianteId) }
        : it);
      await storageSet(KEYS.catalogo, state.catalogo);
      render();
    };
  });
}

function bindUsuarios(){
  const addBtn = document.getElementById('add-user-btn');
  if(addBtn) addBtn.onclick = async () => {
    const nombre = document.getElementById('nu-nombre').value.trim();
    const username = document.getElementById('nu-username').value.trim();
    const password = document.getElementById('nu-password').value;
    const role = document.getElementById('nu-role').value;
    if(!nombre || !username || !password){ showToast('Completa todos los campos.', true); return; }
    if(state.users.some(u=>u.username.toLowerCase()===username.toLowerCase())){
      showToast('Ese nombre de usuario ya existe.', true); return;
    }
    state.users = [...state.users, { id: uid('u'), nombre, username, password, role }];
    await storageSet(KEYS.users, state.users);
    state.newUser = { username:'', password:'', nombre:'', role:'operador' };
    showToast('Usuario creado.');
    render();
  };

  document.querySelectorAll('[data-del-user]').forEach(btn => {
    btn.onclick = async () => {
      const id = btn.getAttribute('data-del-user');
      const admins = state.users.filter(u=>u.role==='admin');
      const target = state.users.find(u=>u.id===id);
      if(target.role==='admin' && admins.length<=1){
        showToast('No puedes eliminar al único administrador.', true); return;
      }
      state.users = state.users.filter(u=>u.id!==id);
      await storageSet(KEYS.users, state.users);
      render();
    };
  });
}
